# Log level: trace, debug, info, warn, error (overridden by RUST_LOG env var)
# log_level = "info"

[jira]
instance = "mycompany"
email = "you@company.com"
api_token = "your-api-token"
cron_schedule = "0 */5 * * * *"
fetch_limit = 5
jql = 'assignee = currentUser() AND status = "In Progress"'

[claude]
home_dir = "~/.claude"
extra_flags = ""
plan_prompt_template = ""

[paths]
output_dir = "~/.dev-pipeline/tickets"
repo_root = "~/projects/my-service"
state_dir = "~/.dev-pipeline"
log_dir = "~/.dev-pipeline/logs"

[git]
branch_prefix = "feature"
base_branch = "main"

[worktree]
enabled = true

[tmux]
session_name = "dev-pipeline"

[spawner]
poll_interval_secs = 10
