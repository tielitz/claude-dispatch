# Release pipeline.
#
# Triggered manually from the Actions UI with a semver `version` input.
# The `prepare` job bumps Cargo.toml and pushes a commit + `vX.Y.Z` tag to
# `main` BEFORE any binary is built. If a downstream `build` or `release`
# job then fails, manual cleanup is required:
#
#   git push --delete origin vX.Y.Z
#   git revert <bump-commit-sha> && git push
#
# Release notes are auto-generated by GitHub from PR titles since the prior
# tag (no CHANGELOG.md is committed).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to release (e.g. 0.2.0, no v prefix)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: claude-dispatch

jobs:
  prepare:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate version input
        id: validate
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # Route inputs.version through an env var so the regex guard runs
          # against shell data, not an expression expanded into the script
          # body. See GitHub's script-injection hardening guidance.
          version="$VERSION_INPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Version is not valid semver (expected e.g. 0.2.0 or 1.0.0-rc.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag does not already exist
        run: |
          tag="v${{ steps.validate.outputs.version }}"
          # Local check: checkout with fetch-depth: 0 pulls all tags.
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists locally"
            exit 1
          fi
          # Remote check: catches tags created on origin since checkout and
          # distinguishes "tag exists" (rc=0) from "tag absent" (rc=2) from
          # "network/auth failure" (anything else) so transient errors fail
          # loudly instead of letting the pipeline proceed.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          rc=$?
          set -e
          case $rc in
            0) echo "::error::Tag $tag already exists on origin"; exit 1 ;;
            2) ;;
            *) echo "::error::Failed to query origin for tag $tag (git ls-remote exit $rc)"; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bump Cargo.toml version
        run: |
          version="${{ steps.validate.outputs.version }}"
          python3 - "$version" <<'PY'
          import re, sys
          new = sys.argv[1]
          path = "Cargo.toml"
          src = open(path).read()
          # Only the version line in the [package] section.
          pattern = re.compile(r'(\[package\][^\[]*?\nversion\s*=\s*")[^"]+(")', re.DOTALL)
          new_src, n = pattern.subn(rf'\g<1>{new}\g<2>', src, count=1)
          if n != 1:
              sys.exit("Failed to locate [package] version line in Cargo.toml")
          open(path, "w").write(new_src)
          PY
          grep '^version' Cargo.toml

      - name: Refresh Cargo.lock
        run: cargo update -p "$BIN_NAME"

      - name: Commit, tag, and push
        id: tag
        run: |
          version="${{ steps.validate.outputs.version }}"
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $tag"
          git tag -a "$tag" -m "Release $tag"
          git push origin HEAD:main
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        id: package
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          stage="$BIN_NAME-v${version}-${target}"
          mkdir -p "dist/$stage"
          cp "target/${target}/release/$BIN_NAME" "dist/$stage/"
          cp README.md LICENSE config.example.toml "dist/$stage/"
          tarball="${stage}.tar.gz"
          tar -C dist -czf "dist/$tarball" "$stage"
          ( cd dist && shasum -a 256 "$tarball" > "${tarball}.sha256" )
          ls -l dist/
          echo "tarball=dist/$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${tarball}.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            *.tar.gz *.tar.gz.sha256 SHA256SUMS
